name: Update README compatibility

on:
    push:
        paths:
            - 'hacs.json'
    workflow_dispatch:
        inputs:
            target_ref:
                description: Branch to update.
                required: false
                default: mane
    workflow_call:
        inputs:
            target_ref:
                description: Branch to update.
                required: false
                default: mane
                type: string
    schedule:
        - cron: '0 6 * * *' # daily at 06:00 UTC

permissions:
    contents: write

jobs:
    update-compat:
        runs-on: ubuntu-latest
        env:
            TARGET_REF: ${{ inputs.target_ref || github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ env.TARGET_REF }}
            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
            - name: Install dependencies
              run: python -m pip install --upgrade pip
            - name: Run README compat updater
              run: |
                  python3 scripts/update_readme_compat.py
            - name: Commit and push if changed
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if ! git diff --quiet; then
                    git add README.md
                    git commit -m "chore: update compatibility table from hacs.json"
                    git push origin HEAD:"${TARGET_REF}"
                  else
                    echo "No changes to commit"
                  fi
