name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    update-compat:
        name: Update README compatibility
        uses: ./.github/workflows/update-compat.yml
        permissions:
            contents: write
        with:
            target_ref: mane

    build:
        name: Build Frontend
        needs: update-compat
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'

            - name: Enable Corepack and activate package manager (from package.json)
              run: |
                  chmod +x ./scripts/ensure_yarn.sh || true
                  ./scripts/ensure_yarn.sh

            - name: Install dependencies
              working-directory: frontend
              run: |
                  if [ -f yarn.lock ] || [ -f .yarn/lock.yml ]; then
                    echo "Lockfile found, running corepack yarn install --immutable"
                    corepack yarn install --immutable
                  else
                    echo "No lockfile present, running regular corepack yarn install"
                    corepack yarn install
                  fi

            - name: Build frontend
              working-directory: frontend
              run: corepack yarn build

            - name: Upload frontend artifact
              uses: actions/upload-artifact@v7
              with:
                  name: frontend-build
                  path: nanoleaf-effect-card.js
                  if-no-files-found: error

    release:
        name: Create Release
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Download frontend artifact
              uses: actions/download-artifact@v8
              with:
                  name: frontend-build
                  path: custom_components/nanoleaf_effect_card/www/

            - name: Get version from tag
              id: version
              run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

            - name: Update manifest version
              run: |
                  sed -i 's/"version": ".*"/"version": "${{ steps.version.outputs.version }}"/' custom_components/nanoleaf_effect_card/manifest.json

            - name: Create release zip
              run: |
                  # Zip contains integration files at root; HACS places them in custom_components/<domain>/
                  mkdir -p zip_contents/www
                  cp custom_components/nanoleaf_effect_card/manifest.json zip_contents/
                  cp custom_components/nanoleaf_effect_card/__init__.py zip_contents/
                  cp custom_components/nanoleaf_effect_card/const.py zip_contents/
                  cp custom_components/nanoleaf_effect_card/config_flow.py zip_contents/
                  cp custom_components/nanoleaf_effect_card/www/nanoleaf-effect-card.js zip_contents/www/
                  cd zip_contents
                  zip -r ../nanoleaf-effect-card.zip .

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: nanoleaf-effect-card.zip
                  generate_release_notes: true
                  draft: false
                  prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    hacs-validate:
        name: HACS Validation
        needs: update-compat
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: HACS Validation
              uses: hacs/action@main
              with:
                  category: integration
                  ignore: brands
